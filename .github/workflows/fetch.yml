name: Fetch Telegram Quiz

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "Scan full history instead of only new messages"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-quizzes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch quizzes
        run: python fetch_quizzes.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_GROUP: ${{ vars.TELEGRAM_GROUP }}
          BACKFILL: ${{ inputs.backfill }}

      - name: Validate data
        run: python validate.py

      - name: Commit changes
        run: |
          git config user.name "Quiz Bot"
          git config user.email "bot@github.com"
          git add quizzes.json metadata.json
          git diff --cached --quiet && exit 0
          git commit -m "Update quiz database"
          git pull --rebase
          git push

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Quiz fetch workflow failed"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" --body "Run: $url
          Common causes: expired TELEGRAM_SESSION, rate limit, wrong TELEGRAM_GROUP."
          fi
