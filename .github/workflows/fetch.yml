name: Fetch Telegram Quiz

on:

  schedule:

    - cron: "*/15 * * * *"

  workflow_dispatch:


jobs:

  fetch:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Node
      uses: actions/setup-node@v4

      with:

        node-version: 20



    - name: Install packages
      run: npm install



    - name: Fetch quizzes
      run: node fetch_quizzes.js

      env:

        TELEGRAM_API_ID:
          ${{ secrets.TELEGRAM_API_ID }}

        TELEGRAM_API_HASH:
          ${{ secrets.TELEGRAM_API_HASH }}

        TELEGRAM_SESSION:
          ${{ secrets.TELEGRAM_SESSION }}



    - name: Commit updates

      run: |

        git config --global user.name "Quiz Collector"

        git config --global user.email "quiz@github.com"

        git add .

        git commit -m "Update quizzes" || exit 0

        git push
