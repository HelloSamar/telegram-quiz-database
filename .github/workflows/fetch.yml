name: Fetch Telegram Quiz

on:
  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:


jobs:

  fetch:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        pip install -r requirements.txt


    - name: Fetch quizzes
      run: |
        python fetch_quizzes.py

      env:
        TELEGRAM_API_ID:
          ${{ secrets.TELEGRAM_API_ID }}

        TELEGRAM_API_HASH:
          ${{ secrets.TELEGRAM_API_HASH }}

        TELEGRAM_SESSION:
          ${{ secrets.TELEGRAM_SESSION }}


    - name: Commit changes
      run: |
        git config --global user.name "Quiz Bot"
        git config --global user.email "bot@github.com"

        git add .

        git commit -m "Update quiz database" || exit 0

        git push
